<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>指标展示实验台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a20;
      --panel-2: #1f242c;
      --line: #2d3440;
      --line-strong: #475160;
      --grid: rgba(151, 164, 183, 0.16);
      --text: #edf0f4;
      --muted: #9ba5b4;
      --soft: #687385;
      --accent: #d8a339;
      --blue: #61a6ff;
      --green: #53c58b;
      --red: #f06b61;
      --flat: #aab2bd;
      --shadow: rgba(0, 0, 0, 0.28);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #12151a;
      padding: 24px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      box-shadow: 0 10px 24px rgba(97, 166, 255, 0.18);
    }

    .brand h1 {
      font-size: 17px;
      line-height: 1.2;
      margin: 0;
      letter-spacing: 0;
    }

    .meta {
      color: var(--soft);
      font-size: 12px;
      margin-top: 3px;
    }

    .control-block {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin-top: 18px;
    }

    .control-title {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .segmented {
      display: grid;
      gap: 8px;
    }

    .segmented.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .segmented button,
    .chip {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      min-height: 40px;
    }

    .segmented button[aria-selected="true"],
    .chip[aria-selected="true"] {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(216, 163, 57, 0.12);
    }

    .segmented button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .indicator-list {
      display: grid;
      gap: 9px;
      margin-top: 10px;
    }

    .check-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .check-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      margin: 1px 0 0;
    }

    .main {
      min-width: 0;
      padding: 28px 32px 48px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0;
      margin-bottom: 5px;
    }

    h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .summary {
      color: var(--muted);
      max-width: 680px;
      margin-top: 8px;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .status-pill {
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      white-space: nowrap;
      background: var(--panel);
    }

    .range-tabs {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(4, minmax(54px, 1fr));
      gap: 3px;
    }

    .range-tabs button {
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      min-height: 30px;
      padding: 6px 8px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
    }

    .range-tabs button[aria-selected="true"] {
      color: var(--text);
      background: rgba(216, 163, 57, 0.15);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(300px, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0)),
        var(--panel);
      min-height: 338px;
      box-shadow: 0 18px 44px var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
    }

    .item-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .item-label h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .points {
      color: var(--soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .item-name {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      min-height: 32px;
    }

    .metric-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 0;
    }

    .current {
      font-size: 30px;
      font-weight: 650;
      line-height: 1;
      word-break: break-word;
    }

    .delta {
      font-size: 13px;
      white-space: nowrap;
    }

    .delta.pos { color: var(--green); }
    .delta.neg { color: var(--red); }
    .delta.flat { color: var(--flat); }

    .chart-shell {
      margin-top: auto;
      padding: 10px 14px 16px;
      min-height: 188px;
    }

    .chart {
      display: block;
      width: 100%;
      height: auto;
      min-height: 178px;
      border-radius: 6px;
      background: #11151b;
    }

    .axis-label {
      fill: var(--soft);
      font-size: 10px;
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: 1;
    }

    .axis-line {
      stroke: var(--line-strong);
      stroke-width: 1;
    }

    .empty-chart {
      min-height: 178px;
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      background: #11151b;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 13px;
    }

    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      background: var(--panel);
    }

    .asset-note {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 14px 16px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .asset-note strong {
      color: var(--text);
      font-weight: 650;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .content-grid { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
    }

    @media (max-width: 640px) {
      .main { padding: 22px 16px 36px; }
      .topbar { display: block; }
      .top-actions { align-items: stretch; margin-top: 12px; }
      .status-pill { display: inline-flex; justify-content: center; }
      .content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <h1>指标展示实验台</h1>
          <div class="meta" id="dataMeta">DATA</div>
        </div>
      </div>

      <div class="control-block">
        <div class="control-title">方向</div>
        <div class="segmented two" id="regionTabs">
          <button type="button" aria-selected="true">中国</button>
          <button type="button" disabled>美国</button>
        </div>
      </div>

      <div class="control-block">
        <div class="control-title">大类</div>
        <div class="segmented" id="sectionTabs"></div>
      </div>

      <div class="control-block" id="assetBlock" hidden>
        <div class="control-title">资产</div>
        <div class="segmented" id="assetTabs"></div>
      </div>

      <div class="control-block">
        <div class="control-title">指标</div>
        <div class="indicator-list" id="indicatorList"></div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <div class="eyebrow" id="breadcrumb">中国 / 经济基本面 / 供给</div>
          <h2 id="viewTitle">供给</h2>
          <div class="summary" id="viewSummary"></div>
        </div>
        <div class="top-actions">
          <div class="status-pill" id="countPill">0 个指标</div>
          <div class="range-tabs" id="rangeTabs" aria-label="时间区间"></div>
        </div>
      </div>

      <div class="toolbar" id="groupTabs"></div>
      <div id="assetNote" class="asset-note" hidden></div>
      <div class="content-grid" id="cards"></div>
    </main>
  </div>

  <script>
    const state = {
      data: null,
      sectionId: 'economy',
      groupId: 'supply',
      assetId: 'a_share',
      range: '12',
      selected: new Map()
    };

    const RANGE_OPTIONS = [
      { id: '3', label: '近3期' },
      { id: '6', label: '近6期' },
      { id: '12', label: '近12期' },
      { id: 'all', label: '全部' }
    ];

    const sectionTabs = document.getElementById('sectionTabs');
    const groupTabs = document.getElementById('groupTabs');
    const assetTabs = document.getElementById('assetTabs');
    const assetBlock = document.getElementById('assetBlock');
    const indicatorList = document.getElementById('indicatorList');
    const cards = document.getElementById('cards');
    const breadcrumb = document.getElementById('breadcrumb');
    const viewTitle = document.getElementById('viewTitle');
    const viewSummary = document.getElementById('viewSummary');
    const countPill = document.getElementById('countPill');
    const dataMeta = document.getElementById('dataMeta');
    const assetNote = document.getElementById('assetNote');
    const rangeTabs = document.getElementById('rangeTabs');

    function keyForCurrent() {
      return `${state.sectionId}:${state.assetId}:${state.groupId}`;
    }

    function getCurrentGroups() {
      const { sections } = state.data;
      if (state.sectionId === 'assets') {
        const asset = sections.assets.assets.find((item) => item.id === state.assetId) || sections.assets.assets[0];
        return asset.groups;
      }
      return sections[state.sectionId].groups;
    }

    function getCurrentGroup() {
      return getCurrentGroups().find((group) => group.id === state.groupId) || getCurrentGroups()[0];
    }

    function getCurrentAsset() {
      return state.data.sections.assets.assets.find((asset) => asset.id === state.assetId) || state.data.sections.assets.assets[0];
    }

    function ensureSelection(group) {
      const key = keyForCurrent();
      if (!state.selected.has(key)) {
        state.selected.set(key, new Set(group.items.map((item) => item.name)));
      }
      return state.selected.get(key);
    }

    function setSelectedButton(container, activeId) {
      [...container.querySelectorAll('button')].forEach((button) => {
        button.setAttribute('aria-selected', String(button.dataset.id === activeId));
      });
    }

    function renderRangeTabs() {
      rangeTabs.innerHTML = '';
      RANGE_OPTIONS.forEach((option) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.id = option.id;
        button.textContent = option.label;
        button.setAttribute('aria-selected', String(option.id === state.range));
        button.addEventListener('click', () => {
          state.range = option.id;
          renderCards(getCurrentGroup(), ensureSelection(getCurrentGroup()));
          setSelectedButton(rangeTabs, state.range);
        });
        rangeTabs.appendChild(button);
      });
    }

    function renderSectionTabs() {
      sectionTabs.innerHTML = '';
      state.data.navigation.sections.forEach((section) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.id = section.id;
        button.textContent = section.label;
        button.setAttribute('aria-selected', String(section.id === state.sectionId));
        button.addEventListener('click', () => {
          state.sectionId = section.id;
          if (section.id === 'assets') {
            const asset = getCurrentAsset();
            state.groupId = asset.groups[0]?.id;
          } else {
            state.groupId = state.data.sections[section.id].groups[0]?.id;
          }
          render();
        });
        sectionTabs.appendChild(button);
      });
    }

    function renderAssetTabs() {
      assetBlock.hidden = state.sectionId !== 'assets';
      assetTabs.innerHTML = '';
      if (state.sectionId !== 'assets') return;
      state.data.sections.assets.assets.forEach((asset) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.id = asset.id;
        button.textContent = asset.label;
        button.setAttribute('aria-selected', String(asset.id === state.assetId));
        button.addEventListener('click', () => {
          state.assetId = asset.id;
          state.groupId = asset.groups[0]?.id;
          render();
        });
        assetTabs.appendChild(button);
      });
    }

    function renderGroupTabs() {
      const groups = getCurrentGroups();
      groupTabs.innerHTML = '';
      groups.forEach((group) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'chip';
        button.dataset.id = group.id;
        button.textContent = group.title;
        button.setAttribute('aria-selected', String(group.id === state.groupId));
        button.addEventListener('click', () => {
          state.groupId = group.id;
          render();
        });
        groupTabs.appendChild(button);
      });
    }

    function renderIndicatorList(group, selection) {
      indicatorList.innerHTML = '';
      group.items.forEach((item) => {
        const row = document.createElement('label');
        row.className = 'check-row';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = selection.has(item.name);
        input.addEventListener('change', () => {
          if (input.checked) selection.add(item.name);
          else selection.delete(item.name);
          renderCards(group, selection);
        });
        const span = document.createElement('span');
        span.textContent = item.label;
        row.append(input, span);
        indicatorList.appendChild(row);
      });
    }

    function signClass(sign) {
      if (sign === 'pos') return 'pos';
      if (sign === 'neg') return 'neg';
      return 'flat';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function visibleSeries(series) {
      const cleaned = (Array.isArray(series) ? series : [])
        .map((point) => ({ date: point.date, value: Number(point.value) }))
        .filter((point) => point.date && Number.isFinite(point.value));
      if (state.range === 'all') return cleaned;
      return cleaned.slice(-Number(state.range));
    }

    function formatDate(dateText) {
      const parts = String(dateText).split('-');
      if (parts.length < 3) return dateText;
      return `${Number(parts[1])}/${Number(parts[2])}`;
    }

    function formatValue(value) {
      const abs = Math.abs(value);
      const maximumFractionDigits = abs >= 100 ? 1 : 2;
      return value.toLocaleString('zh-CN', { maximumFractionDigits });
    }

    function chartColor(sign) {
      if (sign === 'pos') return 'var(--green)';
      if (sign === 'neg') return 'var(--red)';
      return 'var(--blue)';
    }

    function getYTicks(min, max) {
      if (min === max) {
        const pad = Math.abs(min) > 1 ? Math.abs(min) * 0.08 : 1;
        min -= pad;
        max += pad;
      }
      const span = max - min;
      const pad = span * 0.08;
      const low = min - pad;
      const high = max + pad;
      return [0, 0.33, 0.66, 1].map((ratio) => low + (high - low) * ratio);
    }

    function renderChart(item, index) {
      const series = visibleSeries(item.series);
      if (series.length === 0) {
        return '<div class="empty-chart">暂无历史序列</div>';
      }

      const width = 360;
      const height = 178;
      const margin = { top: 18, right: 18, bottom: 34, left: 44 };
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const values = series.map((point) => point.value);
      const yTicks = getYTicks(Math.min(...values), Math.max(...values));
      const yMin = Math.min(...yTicks);
      const yMax = Math.max(...yTicks);
      const denom = Math.max(series.length - 1, 1);
      const color = chartColor(item.sign);
      const gradientId = `area-${index}`;

      const points = series.map((point, pointIndex) => {
        const x = margin.left + (plotWidth * pointIndex) / denom;
        const y = margin.top + plotHeight - ((point.value - yMin) / (yMax - yMin)) * plotHeight;
        return { ...point, x, y };
      });
      if (series.length === 1) points[0].x = margin.left + plotWidth / 2;

      const linePath = points.map((point, pointIndex) => `${pointIndex === 0 ? 'M' : 'L'} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(' ');
      const areaPath = `${linePath} L ${points.at(-1).x.toFixed(1)} ${margin.top + plotHeight} L ${points[0].x.toFixed(1)} ${margin.top + plotHeight} Z`;
      const xTickIndexes = [...new Set([0, Math.floor((series.length - 1) / 2), series.length - 1])];
      const dotStep = series.length > 80 ? Math.ceil(series.length / 80) : 1;
      const latest = points.at(-1);

      const yGrid = yTicks.map((tick) => {
        const y = margin.top + plotHeight - ((tick - yMin) / (yMax - yMin)) * plotHeight;
        return `
          <line class="grid-line" x1="${margin.left}" y1="${y.toFixed(1)}" x2="${width - margin.right}" y2="${y.toFixed(1)}"></line>
          <text class="axis-label" x="${margin.left - 8}" y="${(y + 3).toFixed(1)}" text-anchor="end">${formatValue(tick)}</text>
        `;
      }).join('');

      const xLabels = xTickIndexes.map((pointIndex) => {
        const point = points[pointIndex];
        return `<text class="axis-label" x="${point.x.toFixed(1)}" y="${height - 10}" text-anchor="middle">${formatDate(point.date)}</text>`;
      }).join('');

      const dots = points.map((point, pointIndex) => {
        if (pointIndex !== points.length - 1 && pointIndex % dotStep !== 0) return '';
        const r = pointIndex === points.length - 1 ? 3.8 : 2.2;
        const opacity = pointIndex === points.length - 1 ? 1 : 0.72;
        return `<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="${r}" fill="${color}" opacity="${opacity}"><title>${escapeHtml(point.date)}: ${formatValue(point.value)}</title></circle>`;
      }).join('');

      return `
        <svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(item.label)}历史走势">
          <defs>
            <linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${color}" stop-opacity="0.26"></stop>
              <stop offset="100%" stop-color="${color}" stop-opacity="0"></stop>
            </linearGradient>
          </defs>
          ${yGrid}
          <line class="axis-line" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${margin.top + plotHeight}"></line>
          <line class="axis-line" x1="${margin.left}" y1="${margin.top + plotHeight}" x2="${width - margin.right}" y2="${margin.top + plotHeight}"></line>
          ${xLabels}
          <path d="${areaPath}" fill="url(#${gradientId})"></path>
          <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
          ${dots}
          <text class="axis-label" x="${Math.min(latest.x + 8, width - 72).toFixed(1)}" y="${Math.max(latest.y - 8, 14).toFixed(1)}">${formatValue(latest.value)}</text>
        </svg>
      `;
    }

    function renderCards(group, selection) {
      const selectedItems = group.items.filter((item) => selection.has(item.name));
      cards.innerHTML = '';
      countPill.textContent = `${selectedItems.length} 个指标`;

      if (selectedItems.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '当前未选择指标';
        cards.appendChild(empty);
        return;
      }

      selectedItems.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="item-label">
              <h3>${escapeHtml(item.label)}</h3>
              <span class="points">${visibleSeries(item.series).length || item.points}期</span>
            </div>
            <div class="item-name">${escapeHtml(item.name)}</div>
          </div>
          <div class="metric-row">
            <div class="current">${escapeHtml(item.current)}</div>
            <div class="delta ${signClass(item.sign)}">${escapeHtml(item.delta || '持平')}</div>
          </div>
          <div class="chart-shell">${renderChart(item, index)}</div>
        `;
        cards.appendChild(card);
      });
    }

    function renderTitle(group) {
      const section = state.data.navigation.sections.find((item) => item.id === state.sectionId);
      const asset = state.sectionId === 'assets' ? getCurrentAsset() : null;
      const middle = asset ? `${section.label} / ${asset.label}` : section.label;
      breadcrumb.textContent = `${state.data.region.label} / ${middle} / ${group.title}`;
      viewTitle.textContent = group.title;
      viewSummary.textContent = group.subtitle || state.data.region.subtitle || '';

      if (asset) {
        assetNote.hidden = false;
        assetNote.innerHTML = `<strong>${asset.strategyTitle}</strong> ${asset.conclusion}<br>${asset.action}`;
      } else {
        assetNote.hidden = true;
        assetNote.innerHTML = '';
      }
    }

    function render() {
      const group = getCurrentGroup();
      const selection = ensureSelection(group);
      renderSectionTabs();
      renderAssetTabs();
      renderGroupTabs();
      renderRangeTabs();
      renderIndicatorList(group, selection);
      renderTitle(group);
      renderCards(group, selection);
      setSelectedButton(sectionTabs, state.sectionId);
      setSelectedButton(assetTabs, state.assetId);
    }

    fetch('../data/china_display_data.json')
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((data) => {
        state.data = data;
        dataMeta.textContent = data.meta.generatedAt;
        render();
      })
      .catch((error) => {
        cards.innerHTML = `<div class="empty">数据加载失败: ${error.message}</div>`;
      });
  </script>
</body>
</html>
